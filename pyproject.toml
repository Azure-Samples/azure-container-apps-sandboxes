[project]
name = "aca-sandboxes-samples"
version = "0.1.0"
description = "Samples for Azure Container Apps Sandboxes"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "azure-containerapps-sandbox>=0.1.0b1",
    "azure-identity>=1.15.0",
    "azure-mgmt-resource",
    "azure-mgmt-authorization>=4.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.50.0",
]
agents = [
    "openai-agents>=0.17.0",
    "agents-extension-aca-sandboxes",
    "azure-mgmt-resourcegraph>=8.0.0",
]
connectors = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
agents-extension-aca-sandboxes = { path = "python/samples/08-sandbox-agents/openai/sandbox-agent-extension", editable = true }

[dependency-groups]
test = [
    "pytest>=8",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: real Azure end-to-end run, skipped unless RUN_E2E=1",
]
addopts = "-m 'not e2e'"
